<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Créer une Carte d'Épargne</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf9f9;
        }
        .bg-gradient-custom {
            background: radial-gradient(circle at top right, rgba(234, 195, 44, 0.1) 0%, rgba(250, 249, 249, 1) 40%);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-fixed-dim": "#eac32c",
                        "surface-container-highest": "#e3e2e2",
                        "on-primary-container": "#725d00",
                        "background": "#faf9f9",
                        "surface-bright": "#faf9f9",
                        "surface-container-high": "#e9e8e8",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e3e2e2",
                        "surface-container": "#efeeed",
                        "outline-variant": "#d0c6ad",
                        "on-surface": "#1a1c1c",
                        "surface": "#faf9f9",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f4f3f3",
                        "primary-container": "#ffd640",
                        "primary": "#725c00",
                        "on-surface-variant": "#4d4634"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "lg": "32px",
                        "xl": "48px",
                        "gutter": "12px",
                        "sm": "16px",
                        "container-margin": "20px",
                        "base": "4px",
                        "xs": "8px",
                        "md": "24px"
                    },
                    fontFamily: {
                        "headline-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    fontSize: {
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "14px", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "16px", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-screen flex flex-col items-center md:py-8 bg-gradient-custom">
<!-- Mobile Container -->
<main class="w-full max-w-[540px] h-full bg-surface relative flex flex-col md:rounded-[32px] md:shadow-2xl overflow-hidden md:h-[850px]">
<!-- Header -->
<header class="flex items-center justify-between px-container-margin py-md w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Créer une Carte</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Form Content -->
<div class="flex-1 overflow-y-auto px-container-margin pb-xl">
<p class="font-label-md text-label-md text-on-surface-variant mb-2">Sélection du client</p>
<!-- Client Selection Card -->
<div class="bg-surface-container-lowest rounded-xl p-sm mb-lg flex items-center justify-between shadow-[0_4px_20px_rgba(0,0,0,0.05)] cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant">person_search</span>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface">Sélectionner un client</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Rechercher par nom ou numéro</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant mb-2 mt-md">Mise Quotidienne</p>
<!-- Amount Input (Inspired by "Add Money") -->
<div class="flex items-center mb-lg">
<span class="font-headline-lg text-headline-lg text-on-surface-variant mr-1">$</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-headline-lg text-headline-lg text-on-surface placeholder-on-surface-variant/30 caret-primary-fixed-dim" placeholder="0.00" style="font-size: 40px; line-height: 48px; font-weight: 600;" type="number" value="150.00"/>
<div class="w-px h-10 bg-on-surface animate-pulse ml-1"></div>
</div>
<!-- Configuration Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-md mb-lg shadow-[0_4px_20px_rgba(0,0,0,0.05)] space-y-md">
<!-- Currency Selection -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A small circular flag icon representing the US Dollar, stylized in a modern flat design suitable for a mobile banking application interface. Clean lines, high contrast." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjMUz1OiOhIktcteNKuAp8Y6VmVvehoQK0uAQCNAPzIuRzDkZm4EmBBEv5I6YzrQouq5KkfS7sMBo9rSgJuUNNaX025MRZdD_I9eCuvS28gqs-23GRDQOjqLnaLO9scltNx0k4riK7HcvA_06AVcy_mqdCStPhwCwHJa7yKm_LSyFpTz5NYD5NMo4NHOZh3L-pBdZmwCD09MdiGLNzCaTCfXQ4OABV6q5RT2puEU-evcvYxr2aC0tfp8JqeCfssiv4f02u1fnq_1U"/>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface font-semibold">US Dollar</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Devise de la carte</p>
</div>
</div>
<button class="bg-surface-container-high text-on-surface px-3 py-1 rounded-full font-label-sm text-label-sm hover:bg-surface-container-highest transition-colors">
                        Changer
                    </button>
</div>
<hr class="border-outline-variant/30"/>
<!-- Duration Input -->
<div class="flex items-center justify-between">
<div>
<p class="font-label-md text-label-md text-on-surface font-semibold">Durée d'épargne</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Nombre de jours</p>
</div>
<div class="flex items-center bg-surface-container-low rounded-lg border border-outline-variant/50 p-1">
<button class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-surface-container-highest text-on-surface-variant"><span class="material-symbols-outlined text-[20px]">remove</span></button>
<input class="w-12 text-center bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md font-semibold text-on-surface" type="number" value="30"/>
<button class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-surface-container-highest text-on-surface-variant"><span class="material-symbols-outlined text-[20px]">add</span></button>
</div>
</div>
</div>
<!-- Summary Details -->
<div class="px-sm mb-xl">
<div class="flex justify-between items-center mb-2">
<p class="font-label-md text-label-md text-on-surface-variant">Total projeté</p>
<p class="font-label-md text-label-md font-semibold text-on-surface">$4,500.00</p>
</div>
<div class="flex justify-between items-center">
<p class="font-label-md text-label-md text-on-surface-variant">Date de fin</p>
<p class="font-label-md text-label-md font-semibold text-on-surface">24 Nov 2023</p>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-sm text-headline-sm h-[56px] rounded-full shadow-[0_4px_12px_rgba(234,195,44,0.18)] hover:bg-primary-fixed-dim hover:scale-[0.98] transition-all flex items-center justify-center mt-auto">
                Créer la carte
            </button>
</div>
</main>
</body></html>
